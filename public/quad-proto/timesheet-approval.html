<script src="employees-data.js"></script>
<script src="timesheet-seed.js"></script>
<script>
(function () {
  seedAllTimesheetsIfNeeded();

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function periodLabel(pk) {
    var parts = pk.split('-');
    return MONTHS[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
  }

  function goToPeriodDetail(period) {
    window.location.href = 'timesheet-approval-detail.html?period=' + encodeURIComponent(period);
  }
  window.goToPeriodDetail = goToPeriodDetail;

  function collectPeriods() {
    // Badge validity here must match timesheet-approval-detail.html's
    // getAllEntries(): any badge present in QUADRA_EMPLOYEES, regardless of
    // employment status (an Inactive employee can still have submitted a
    // timesheet before leaving). Orphaned localStorage keys whose badge isn't
    // an employee at all are skipped — the detail page can't render them, so
    // counting them here would produce a period row that opens empty.
    var knownBadges = {};
    QUADRA_EMPLOYEES.forEach(function (emp) { knownBadges[emp.badge] = true; });
    // Denominator spans every employee for the same reason, so it can never
    // come out below the numerator.
    var totalEmployees = QUADRA_EMPLOYEES.length;

    var byPeriod = {};
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      var m = /^quadra_timesheet_(.+)_(\d{4}-\d{2})$/.exec(key);
      if (!m) continue;
      if (!knownBadges[m[1]]) continue;
      var period = m[2];
      var data;
      try { data = JSON.parse(localStorage.getItem(key)); } catch (e) { continue; }
      if (!data || data.status === 'Draft') continue;
      if (!byPeriod[period]) byPeriod[period] = { submitted: 0, pending: 0, rejected: 0, total: totalEmployees };
      byPeriod[period].submitted++;
      if (data.status === 'Submitted') byPeriod[period].pending++;
      if (data.status === 'Rejected') byPeriod[period].rejected++;
    }
    return byPeriod;
  }

  function render() {
    var byPeriod = collectPeriods();
    var periods = Object.keys(byPeriod).sort().reverse();
    var tbody = document.getElementById('period-tbody');

    if (!periods.length) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:32px 0;color:#9CA3AF;font-size:13px">No submitted timesheets yet.</td></tr>';
      return;
    }

    tbody.innerHTML = periods.map(function (period) {
      var info = byPeriod[period];
      var statusHtml = info.pending > 0
        ? '<span class="tag tag-warning">' + info.pending + ' pending review</span>'
        : info.rejected > 0
          ? '<span class="tag tag-danger">' + info.rejected + ' rejected</span>'
          : '<span class="tag tag-success">All reviewed</span>';
      return '<tr style="cursor:pointer" onclick="goToPeriodDetail(\'' + period + '\')">'
        + '<td>' + periodLabel(period) + '</td>'
        + '<td style="text-align:right;font-variant-numeric:tabular-nums;color:#111827">' + info.submitted + ' of ' + info.total + '</td>'
        + '<td>' + statusHtml + '</td>'
        + '</tr>';
    }).join('');
  }

  render();
})();
</script>
