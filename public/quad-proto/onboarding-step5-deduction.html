<script>
  if (localStorage.getItem('quadra_role') === 'hr-umum') { window.location.replace('onboarding-employee-list.html'); }

  var DEDUCTION_OPTIONS = QUADRA_DEDUCTIONS.map(function(d) { return d.name; });

  var rowCounter = 2;

  /* ── Used deductions tracking ───────────────────────────── */
  var usedDeductions = new Set();
  document.querySelectorAll('#deduction-rows .select-w').forEach(function(sw) {
    var txt = (sw.querySelector('span') || {}).textContent || '';
    txt = txt.trim();
    if (DEDUCTION_OPTIONS.indexOf(txt) !== -1) {
      usedDeductions.add(txt);
      sw.dataset.selectedValue = txt;
    }
  });

  /* ── Add Deduction row ──────────────────────────────────── */
  var addBtn = document.getElementById('add-deduction-btn');
  var rowsContainer = document.getElementById('deduction-rows');

  addBtn.addEventListener('click', function() {
    var idx = rowCounter++;
    var row = document.createElement('div');
    row.className = 'allowance-row';
    row.innerHTML =
      '<div class="select-w" style="flex:1;min-width:0;"></div>' +
      '<div class="source-radio-group">' +
        '<label class="radio-opt">' +
          '<input type="radio" name="ded-' + idx + '" value="personal" checked />' +
          '<span>Personal</span>' +
        '</label>' +
        '<label class="radio-opt">' +
          '<input type="radio" name="ded-' + idx + '" value="company" />' +
          '<span>Company</span>' +
        '</label>' +
        '<label class="radio-opt">' +
          '<input type="radio" name="ded-' + idx + '" value="spouse" />' +
          '<span>Spouse</span>' +
        '</label>' +
      '</div>' +
      '<button class="remove-btn" type="button">&#x2715;</button>';
    var selectW = row.querySelector('.select-w');
    QuadraDropdown.init(selectW,
      DEDUCTION_OPTIONS.filter(function(o) { return !usedDeductions.has(o); }),
      { placeholder: 'Select deduction', onChange: function(val) {
        var oldVal = selectW.dataset.selectedValue || '';
        if (oldVal) usedDeductions.delete(oldVal);
        usedDeductions.add(val);
      }});
    row.querySelector('.remove-btn').addEventListener('click', function() {
      if (selectW && selectW.dataset.selectedValue) usedDeductions.delete(selectW.dataset.selectedValue);
      row.remove();
    });
    rowsContainer.appendChild(row);
  });

  /* ── Remove existing rows ───────────────────────────────── */
  document.querySelectorAll('.remove-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var row = this.closest('.allowance-row');
      var sw = row && row.querySelector('.select-w');
      if (sw && sw.dataset.selectedValue) usedDeductions.delete(sw.dataset.selectedValue);
      if (row) row.remove();
    });
  });
</script>
<script>
  function hasFormData() {
    if (document.querySelectorAll('#deduction-rows .allowance-row').length > 0) return true;
    var picks = document.querySelectorAll('.select-w');
    for (var i = 0; i < picks.length; i++) { if (picks[i].dataset.selectedValue) return true; }
    return false;
  }
  function handleCancel() {
    if (hasFormData()) { document.getElementById('cancel-modal').classList.add('show'); }
    else { window.location.href = 'onboarding-employee-list.html'; }
  }
</script>
