<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadraNG — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #F7F7F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      width: 440px;
      padding: 48px 40px 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
      border-radius: 6px;
    }

    /* ── Header ── */
    .card-header { text-align: center; margin-bottom: 32px; }
    .globe-icon { margin-bottom: 14px; }
    .app-name { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 10px; }
    .app-sub { font-size: 13px; color: #6B7280; line-height: 1.65; max-width: 260px; margin: 0 auto; }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }
    .field label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #D1D5DB;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #111827;
      outline: none;
      background: #fff;
      border-radius: 0;
    }
    .field input::placeholder { color: #9CA3AF; }
    .field input:focus { border-color: #E04A2A; }

    /* Password with eye toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 40px; }
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      padding: 0;
      display: flex;
      align-items: center;
      line-height: 1;
    }
    .pw-toggle:hover { color: #374151; }

    /* Role selector */
    .role-field { margin-bottom: 24px; }
    .role-field label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }
    .role-select-w {
      position: relative;
      display: flex;
      align-items: center;
    }
    .role-select-w select {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 12px;
      border: 1px solid #D1D5DB;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #111827;
      background: #fff;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      border-radius: 0;
    }
    .role-select-w select:focus { border-color: #E04A2A; }
    .role-select-w .chevron {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: #6B7280;
      display: flex;
      align-items: center;
    }

    /* Sign-in button */
    .signin-btn {
      width: 100%;
      height: 44px;
      background: #E04A2A;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      border-radius: 0;
      white-space: nowrap;
    }
    .signin-btn:hover { background: #c93d21; }

    /* Forgot password */
    .forgot-link {
      display: block;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #E04A2A;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
    }
    .forgot-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <div class="globe-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="11.5" stroke="#111827" stroke-width="1.5"/>
        <ellipse cx="14" cy="14" rx="5.5" ry="11.5" stroke="#111827" stroke-width="1.5"/>
        <path d="M2.5 10h23M2.5 18h23" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="app-name">QuadraNG</div>
    <div class="app-sub">Quadra New Generations replacement of old Quadra</div>
  </div>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="e.g. jane.doe@acme.com" autocomplete="username">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="Use alphanumeric characters" autocomplete="current-password">
      <button class="pw-toggle" type="button" onclick="togglePassword(this)" aria-label="Toggle password visibility">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <ellipse cx="9" cy="9" rx="7" ry="5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="role-field">
    <label for="role-select">Login as</label>
    <div class="role-select-w">
      <select id="role-select" onchange="toggleEmployeePicker(this.value)">
        <option value="hr-umum">HR Umum</option>
        <option value="hr-finance">HR Finance</option>
        <option value="karyawan">Karyawan</option>
      </select>
      <span class="chevron">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 4l4 4 4-4" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
  </div>

  <div class="role-field" id="employee-picker-field" style="display:none">
    <label for="employee-select">Login as (employee)</label>
    <div class="role-select-w">
      <select id="employee-select"></select>
      <span class="chevron">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 4l4 4 4-4" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
  </div>

  <button class="signin-btn" onclick="handleLogin()">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <rect x="2" y="6.5" width="11" height="7.5" rx="1" stroke="#fff" stroke-width="1.4"/>
      <path d="M5 6.5V5a2.5 2.5 0 015 0v1.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    Secure Sign-in
  </button>

  <a href="#" class="forgot-link">Forgot password?</a>

</div>

<script src="employees-data.js"></script>
<script>
  function togglePassword(btn) {
    var inp = document.getElementById('password');
    var isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    btn.style.color = isHidden ? '#E04A2A' : '#9CA3AF';
  }

  // HR Umum and HR Finance are each a fixed employee identity (their own
  // badge, with the HR role layered on top) — no "which employee" picker
  // needed for them, only Karyawan (many different employees share that
  // one self-service role) needs to pick who's logging in.
  var HR_ROLE_BADGES = { 'hr-umum': '001228', 'hr-finance': '000000011' };

  function toggleEmployeePicker(role) {
    var field = document.getElementById('employee-picker-field');
    field.style.display = role === 'karyawan' ? 'block' : 'none';
  }

  (function populateEmployeePicker() {
    var sel = document.getElementById('employee-select');
    QUADRA_EMPLOYEES.forEach(function(emp) {
      var opt = document.createElement('option');
      opt.value = emp.badge;
      opt.textContent = emp.name + ' (' + emp.badge + ')';
      sel.appendChild(opt);
    });
  })();

  function handleLogin() {
    var role = document.getElementById('role-select').value;
    var badge = role === 'karyawan' ? document.getElementById('employee-select').value : HR_ROLE_BADGES[role];
    localStorage.setItem('quadra_role', role);
    localStorage.setItem('quadra_active_badge', badge);
    if (role === 'karyawan') {
      window.location.href = 'my-profile.html';
      return;
    }
    window.location.href = 'onboarding-employee-list.html';
  }
</script>

</body>
</html>
