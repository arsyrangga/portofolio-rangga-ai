<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuadraNG — Timesheet Approval — Employee Timesheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="fields.css" />
  <link rel="stylesheet" href="tags.css" />
  <link rel="stylesheet" href="layout.css" />
  <style>
    .ts-weekend-row td { color: #9CA3AF; background: #F9FAFB; }
    #view-tbody td { vertical-align: top; }
    .table-wrap thead th { position: sticky; top: 0; z-index: 2; }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar" data-active-menu="my-timesheet" data-active-sub="my-timesheet-approval"></aside>

<div class="right-panel">

  <header class="navbar">
    <div class="hamburger"><span></span><span></span><span></span></div>
    <div class="navbar-right">
      <div class="nav-action"><div class="timer-box" id="clockWidget"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round"/><path d="M10 11l3-3-3-3" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 8H6" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round"/></svg><span>Clock In</span></div></div>
      <div class="nav-divider"></div>
      <div class="nav-action">
        <div class="bell-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 00-5 5v3l-1.5 2h13L14 10V7a5 5 0 00-5-5z" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 15a2 2 0 004 0" stroke="#6B7280" stroke-width="1.5"/></svg>
          <div class="bell-badge">0</div>
        </div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-user">
        <div class="user-avatar">SE</div>
        <span class="user-name">Steradian</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </header>

  <div class="breadcrumb">
    <a href="timesheet-approval.html">Timesheet Approval</a>
    <svg class="bc-sep" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <a href="#" id="bc-period-link">—</a>
    <svg class="bc-sep" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="bc-current" id="bc-emp-name">—</span>
  </div>

  <main class="main-content">

    <a class="back-link" id="backLink" href="timesheet-approval.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLinkText">Back to Timesheet Approval</span>
    </a>

    <div class="page-header">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="emp-cell">
          <div class="emp-avatar" id="emp-avatar" style="width:40px;height:40px;font-size:15px;"></div>
          <div>
            <div class="page-title" id="page-title-name" style="font-size:18px;">—</div>
            <div style="font-size:12px;color:#6B7280;" id="emp-sub">—</div>
          </div>
        </div>
        <span class="tag" id="ts-status-tag"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" onclick="openExportTypeModal()">Export</button>
      </div>
    </div>

    <div class="section-err muted" id="rejectionReasonNote" style="display:none">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:1px"><path d="M8 1.5L1.5 13.5h13L8 1.5z" stroke="#991B1B" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.5" stroke="#991B1B" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11" r="0.7" fill="#991B1B"/></svg>
      <div>
        <div style="font-weight:600;">Rejected</div>
        <div id="rejectionReasonText" style="margin-top:2px;"></div>
      </div>
    </div>

    <div class="stat-row flex">
      <div class="stat-card">
        <div class="stat-label">Total Work Hours</div>
        <div class="stat-value" id="statTotalWork">0h 00m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Days Worked</div>
        <div class="stat-value" id="statHariKerja">0</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">Days Absent</div>
        <div class="stat-value" id="statAbsent">0</div>
        <div class="stat-sub" id="statAbsentSub">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Status</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Total Hours</th>
            <th>Project</th>
            <th>Activity</th>
          </tr>
        </thead>
        <tbody id="view-tbody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- Export modals — identical flow to my-timesheet.html's self-service Export
     (Timesheet/Report x xlsx/PDF), reading the viewed employee's data instead
     of the logged-in user's own. Keep both copies in sync if this flow changes. -->
<div class="modal-overlay" id="export-type-format-modal" onclick="if(event.target===this)closeExportTypeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export</span>
      <button class="modal-close-btn" onclick="closeExportTypeModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Type</div>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="export-type" value="timesheet" checked><div class="radio-dot"></div><span>Timesheet</span></label>
          <label class="radio-option"><input type="radio" name="export-type" value="report"><div class="radio-dot"></div><span>Report</span></label>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="field-label">Format</div>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="export-format" value="xlsx" checked><div class="radio-dot"></div><span>xlsx</span></label>
          <label class="radio-option"><input type="radio" name="export-format" value="pdf"><div class="radio-dot"></div><span>PDF</span></label>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportTypeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportTypeFormat()">Continue</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="export-report-signoff-modal" onclick="if(event.target===this)closeExportReportSignOffModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export Report</span>
      <button class="modal-close-btn" onclick="closeExportReportSignOffModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Reviewed By</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="text-input" id="export-report-jabatan-pemeriksa" placeholder="Position" style="flex:1;" />
          <input type="text" class="text-input" id="export-report-nama-pemeriksa" placeholder="Name" style="flex:1;" />
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="field-label">Approved By</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="text-input" id="export-report-jabatan-disetujui" placeholder="Position" style="flex:1;" />
          <input type="text" class="text-input" id="export-report-nama-menyetujui" placeholder="Name" style="flex:1;" />
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportReportSignOffModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportReportSignOff()">Continue</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="export-report-modal" onclick="if(event.target===this)closeExportReportModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export Report</span>
      <button class="modal-close-btn" onclick="closeExportReportModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Project</div>
        <div class="select-w" id="export-report-project-select"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportReportModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportReportProject()">Export</button>
    </div>
  </div>
</div>

  var MONTHS_LIST = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // dayStatus is stored/compared internally using these exact tokens (matching
  // the external dictionary field names used by Export Report's templates,
  // e.g. JumlahHariPegawaiIjin) — only the user-facing LABEL is English.
  var STATUS_LABELS = { Kerja: 'Work', Ijin: 'Permission', Sakit: 'Sick', Cuti: 'Leave', Alfa: 'Absent' };

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function periodKey(year, month) { return year + '-' + pad2(month + 1); }
  function periodLabel(pk) {
    var parts = pk.split('-');
    return MONTHS_LIST[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
  }
  function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
  function isoDate(year, month, day) { return year + '-' + pad2(month + 1) + '-' + pad2(day); }
  function formatDateDisplay(iso) {
    var parts = iso.split('-').map(function(n) { return parseInt(n, 10); });
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return DOW[d.getDay()] + ', ' + parts[2] + ' ' + MONTHS_LIST[parts[1] - 1].slice(0, 3);
  }

  function timeDiffMinutes(fromVal, toVal) {
    if (!fromVal || !toVal) return 0;
    var fp = fromVal.split(':'), tp = toVal.split(':');
    var fromMins = parseInt(fp[0], 10) * 60 + parseInt(fp[1], 10);
    var toMins   = parseInt(tp[0], 10) * 60 + parseInt(tp[1], 10);
    var diff = toMins - fromMins;
    if (diff < 0) diff += 24 * 60;
    return diff;
  }
  function formatHM(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h ' + pad2(m) + 'm';
  }
  function computeStats(days) {
    var totalWorkMins = 0, hariKerja = 0;
    var counts = { Ijin: 0, Sakit: 0, Cuti: 0, Alfa: 0 };
    days.forEach(function(d) {
      if (d.dayStatus === 'Kerja') {
        hariKerja++;
        totalWorkMins += timeDiffMinutes(d.workStart, d.workEnd);
      } else if (counts.hasOwnProperty(d.dayStatus)) {
        counts[d.dayStatus]++;
      }
    });
    var absentTotal = counts.Ijin + counts.Sakit + counts.Cuti + counts.Alfa;
    var breakdown = ['Ijin', 'Sakit', 'Cuti', 'Alfa'].filter(function(k) { return counts[k] > 0; })
      .map(function(k) { return counts[k] + ' ' + STATUS_LABELS[k]; }).join(' · ');
    if (!breakdown) breakdown = '—';
    return { totalWorkMins: totalWorkMins, hariKerja: hariKerja, absentTotal: absentTotal, breakdown: breakdown, counts: counts };
  }

  // settings.html owns QUADRA_PROJECTS/QUADRA_PROJECTS_V — this page is only a
  // consumer, same read-only-with-fallback-seed convention as my-timesheet.html.
  var PROJECT_SEED_FALLBACK = [
    { id: 1, name: 'NDS', clientId: 1 },
    { id: 2, name: 'CRM', clientId: 1 },
    { id: 3, name: 'Ops Console', clientId: 2 }
  ];
  function loadProjectsForTimesheet() {
    if (localStorage.getItem('QUADRA_PROJECTS') === null) {
      localStorage.setItem('QUADRA_PROJECTS', JSON.stringify(PROJECT_SEED_FALLBACK));
      return PROJECT_SEED_FALLBACK.slice();
    }
    try { return JSON.parse(localStorage.getItem('QUADRA_PROJECTS')) || []; } catch (e) { return []; }
  }
  function loadClientsForTimesheet() {
    try { return JSON.parse(localStorage.getItem('QUADRA_CLIENTS')) || []; } catch (e) { return []; }
  }

  function getEmp(badge) {
    return QUADRA_EMPLOYEES.find(function(e) { return e.badge === badge; }) || null;
  }

  function getQueryParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var currentBadge = getQueryParam('badge');
  var PERIOD = (function() {
    var raw = getQueryParam('period');
    return (raw && /^\d{4}-(0[1-9]|1[0-2])$/.test(raw)) ? raw : null;
  })();
  var currentYear, currentMonth;
  if (PERIOD) {
    var pParts = PERIOD.split('-');
    currentYear = parseInt(pParts[0], 10);
    currentMonth = parseInt(pParts[1], 10) - 1;
  }

  function timesheetKey(badge, period) { return 'quadra_timesheet_' + badge + '_' + period; }

  // Read-only lookup — unlike my-timesheet.html's loadTimesheet(), this never
  // seeds a fresh Draft when nothing is found, since a View action only ever
  // links here from a period/badge combo that's already known (from
  // timesheet-approval-detail.html's getAllEntries()) to have a real record.
  function loadTimesheetFor(badge, period) {
    try {
      var raw = localStorage.getItem(timesheetKey(badge, period));
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (data.days) data.days = data.days.map(timesheetNormalizeDay);
      return data;
    } catch (e) { return null; }
  }

  var STATUS_TAG   = { Submitted: 'tag tag-warning', Approved: 'tag tag-success', Rejected: 'tag tag-danger' };
  var STATUS_LABEL = { Submitted: 'Submitted', Approved: 'Approved', Rejected: 'Rejected' };

  var currentData = null;

  function buildViewRows(d) {
    if (d.dayStatus === 'Weekend') {
      return '<tr class="ts-weekend-row"><td>' + formatDateDisplay(d.date) + '</td><td colspan="6">Weekend</td></tr>';
    }
    if (d.dayStatus === 'Holiday') {
      return '<tr class="ts-weekend-row"><td>' + formatDateDisplay(d.date) + '</td><td colspan="6">Holiday' + (d.holidayName ? ' — ' + timesheetEscHtml(d.holidayName) : '') + '</td></tr>';
    }
    if (d.dayStatus !== 'Kerja') {
      return '<tr><td>' + formatDateDisplay(d.date) + '</td><td>' + (STATUS_LABELS[d.dayStatus] || d.dayStatus) + '</td><td colspan="5">—</td></tr>';
    }

    var projects = loadProjectsForTimesheet();
    var workDiff = timeDiffMinutes(d.workStart, d.workEnd);
    var totalLabel = workDiff > 0 ? formatHM(workDiff) : '—';
    var entries = d.entries && d.entries.length ? d.entries : [null];
    var rowspan = entries.length;

    return entries.map(function(entry, idx) {
      var proj = entry && entry.projectId != null ? projects.find(function(p) { return p.id === entry.projectId; }) : null;
      var row = '<tr>';
      if (idx === 0) {
        row += '<td rowspan="' + rowspan + '">' + formatDateDisplay(d.date) + '</td>'
          + '<td rowspan="' + rowspan + '">Work</td>'
          + '<td rowspan="' + rowspan + '">' + (d.workStart || '—') + '</td>'
          + '<td rowspan="' + rowspan + '">' + (d.workEnd || '—') + '</td>'
          + '<td rowspan="' + rowspan + '">' + totalLabel + '</td>';
      }
      row += '<td>' + (proj ? timesheetEscHtml(proj.name) : '—') + '</td>'
        + '<td>' + (entry && entry.activity ? timesheetEscHtml(entry.activity) : '—') + '</td>';
      row += '</tr>';
      return row;
    }).join('');
  }

  function render() {
    var emp = getEmp(currentBadge);
    var periodTxt = PERIOD ? periodLabel(PERIOD) : 'Unknown period';

    document.getElementById('bc-period-link').textContent = periodTxt;
    document.getElementById('bc-period-link').href = 'timesheet-approval-detail.html?period=' + encodeURIComponent(PERIOD || '');
    document.getElementById('backLinkText').textContent = 'Back to Timesheet Approval — ' + periodTxt;
    document.getElementById('backLink').href = 'timesheet-approval-detail.html?period=' + encodeURIComponent(PERIOD || '');

    if (!emp || !PERIOD) {
      document.getElementById('bc-emp-name').textContent = 'Unknown employee';
      document.querySelector('.main-content').innerHTML =
        '<div class="empty-state">'
        + '<div class="empty-title">Timesheet not found</div>'
        + '<div class="empty-desc">This employee/period combination has no record.</div>'
        + '</div>';
      return;
    }

    document.getElementById('bc-emp-name').textContent = emp.name;
    document.getElementById('page-title-name').textContent = emp.name;
    document.getElementById('emp-sub').textContent = emp.pos + ' · ' + emp.badge;
    var avatar = document.getElementById('emp-avatar');
    avatar.style.background = emp.color;
    avatar.textContent = emp.initials;

    currentData = loadTimesheetFor(currentBadge, PERIOD);
    if (!currentData) {
      document.querySelector('.main-content').innerHTML =
        '<div class="empty-state">'
        + '<div class="empty-title">Timesheet not found</div>'
        + '<div class="empty-desc">This employee/period combination has no record.</div>'
        + '</div>';
      return;
    }

    var tag = document.getElementById('ts-status-tag');
    tag.className = STATUS_TAG[currentData.status] || 'tag tag-neutral';
    tag.textContent = STATUS_LABEL[currentData.status] || currentData.status;

    var reasonNote = document.getElementById('rejectionReasonNote');
    if (currentData.status === 'Rejected' && currentData.rejectionReason) {
      document.getElementById('rejectionReasonText').textContent = currentData.rejectionReason;
      reasonNote.style.display = 'flex';
    } else {
      reasonNote.style.display = 'none';
    }

    var stats = computeStats(currentData.days);
    document.getElementById('statTotalWork').textContent = formatHM(stats.totalWorkMins);
    document.getElementById('statHariKerja').textContent = stats.hariKerja;
    document.getElementById('statAbsent').textContent = stats.absentTotal;
    document.getElementById('statAbsentSub').textContent = stats.breakdown;

    document.getElementById('view-tbody').innerHTML = currentData.days.map(buildViewRows).join('');
  }

  /* ── Export — identical logic/output to my-timesheet.html's self-service
     Export, reading currentData/currentBadge/currentYear/currentMonth for the
     VIEWED employee instead of the logged-in user. Keep both files' export
     code in sync if this flow ever changes. ── */
  function buildTimesheetRows() {
    var rows = [['Date', 'Status', 'Start Time', 'End Time', 'Total Hours', 'Project', 'Activity']];
    var projects = loadProjectsForTimesheet();

    currentData.days.forEach(function(d) {
      var statusLabel = STATUS_LABELS[d.dayStatus] || d.dayStatus;
      if (d.dayStatus !== 'Kerja') {
        rows.push([formatDateDisplay(d.date), statusLabel, '', '', '', '', '']);
        return;
      }
      var diff = timeDiffMinutes(d.workStart, d.workEnd);
      var totalLabel = diff > 0 ? formatHM(diff) : '';
      if (!d.entries.length) {
        rows.push([formatDateDisplay(d.date), statusLabel, d.workStart, d.workEnd, totalLabel, '', '']);
      } else {
        d.entries.forEach(function(entry) {
          var proj = projects.find(function(p) { return p.id === entry.projectId; });
          rows.push([formatDateDisplay(d.date), statusLabel, d.workStart, d.workEnd, totalLabel, proj ? proj.name : '', entry.activity]);
        });
      }
    });

    return rows;
  }

  function exportTimesheet() {
    var rows = buildTimesheetRows();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Timesheet');
    XLSX.writeFile(wb, 'Timesheet_' + (getEmp(currentBadge) || {}).name + '_' + periodLabel(periodKey(currentYear, currentMonth)) + '.xlsx');
  }

  function exportTimesheetPdf() {
    var rows = buildTimesheetRows();
    var doc = new jspdf.jsPDF();
    var y = 15;
    var xPositions = [14, 45, 65, 85, 108, 130, 155];

    doc.setFontSize(14);
    doc.text('Timesheet', 14, y);
    y += 8;

    doc.setFontSize(9);
    rows[0].forEach(function(h, i) { doc.text(h, xPositions[i], y); });
    y += 5;
    doc.line(14, y, 196, y);
    y += 5;

    for (var i = 1; i < rows.length; i++) {
      if (y > 270) { doc.addPage(); y = 15; }
      rows[i].forEach(function(cell, idx) {
        var text = String(cell || '');
        if (idx === 6) {
          var fitted = doc.splitTextToSize(text, 45);
          text = fitted[0] + (fitted.length > 1 ? '...' : '');
        }
        doc.text(text, xPositions[idx], y);
      });
      y += 6;
    }

    doc.save('Timesheet_' + (getEmp(currentBadge) || {}).name + '_' + periodLabel(periodKey(currentYear, currentMonth)) + '.pdf');
  }

  function getDistinctProjectIdsInPeriod() {
    var ids = [];
    currentData.days.forEach(function(d) {
      if (d.dayStatus !== 'Kerja') return;
      d.entries.forEach(function(entry) {
        if (entry.projectId != null && ids.indexOf(entry.projectId) === -1) ids.push(entry.projectId);
      });
    });
    return ids;
  }

  var exportReportProjectIds = null;
  var pendingSignOffData = null;
  var pendingExportFormat = null;

  function openExportTypeModal() {
    document.querySelector('input[name="export-type"][value="timesheet"]').checked = true;
    document.querySelector('input[name="export-format"][value="xlsx"]').checked = true;
    document.getElementById('export-type-format-modal').classList.add('show');
  }
  function closeExportTypeModal() {
    document.getElementById('export-type-format-modal').classList.remove('show');
  }
  function confirmExportTypeFormat() {
    var type = document.querySelector('input[name="export-type"]:checked').value;
    var format = document.querySelector('input[name="export-format"]:checked').value;
    closeExportTypeModal();
    pendingExportFormat = format;

    if (type === 'timesheet') {
      if (format === 'pdf') { exportTimesheetPdf(); } else { exportTimesheet(); }
    } else {
      exportReport();
    }
  }

  function exportReport() {
    var projectIds = getDistinctProjectIdsInPeriod();
    if (!projectIds.length) {
      QuadraToast.show('No project data to export.', 'error');
      return;
    }
    exportReportProjectIds = projectIds;
    document.getElementById('export-report-jabatan-pemeriksa').value = '';
    document.getElementById('export-report-nama-pemeriksa').value = '';
    document.getElementById('export-report-jabatan-disetujui').value = '';
    document.getElementById('export-report-nama-menyetujui').value = '';
    document.getElementById('export-report-signoff-modal').classList.add('show');
  }
  function closeExportReportSignOffModal() {
    document.getElementById('export-report-signoff-modal').classList.remove('show');
  }
  function confirmExportReportSignOff() {
    var signOffData = {
      jabatanPemeriksa: document.getElementById('export-report-jabatan-pemeriksa').value || '',
      namaPemeriksa: document.getElementById('export-report-nama-pemeriksa').value || '',
      jabatanDisetujui: document.getElementById('export-report-jabatan-disetujui').value || '',
      namaMenyetujui: document.getElementById('export-report-nama-menyetujui').value || ''
    };
    closeExportReportSignOffModal();

    if (exportReportProjectIds.length === 1) {
      runExportReport(exportReportProjectIds[0], signOffData);
    } else {
      openExportReportProjectModal(exportReportProjectIds, signOffData);
    }
  }
  function openExportReportProjectModal(projectIds, signOffData) {
    pendingSignOffData = signOffData;
    var allProjects = loadProjectsForTimesheet();
    var options = projectIds.map(function(id) {
      var p = allProjects.find(function(pr) { return pr.id === id; });
      return { value: id, label: p ? p.name : ('Project ' + id) };
    });
    QuadraDropdown.init(document.getElementById('export-report-project-select'), options, {
      value: options[0].value
    });
    document.getElementById('export-report-modal').classList.add('show');
  }
  function closeExportReportModal() {
    document.getElementById('export-report-modal').classList.remove('show');
  }
  function confirmExportReportProject() {
    var projectId = QuadraDropdown.getValue(document.getElementById('export-report-project-select'));
    closeExportReportModal();
    runExportReport(parseInt(projectId, 10), pendingSignOffData);
    pendingSignOffData = null;
  }

  var PER_DAY_FIELDS = ['Date', 'WorkingHourStart', 'WorkingHourEnd', 'TotalHourperbaris', 'Activity', 'Type', 'Location', 'Skills'];

  function substitutePlaceholders(text, dayData, singleValues, isDaySlotRow) {
    return text.replace(/\[([A-Za-z0-9_+]+)\]/g, function(match, fieldName) {
      if (isDaySlotRow && !dayData) return '';
      if (PER_DAY_FIELDS.indexOf(fieldName) !== -1) {
        if (!dayData) return '';
        if (fieldName === 'Date') return dayData.date;
        if (fieldName === 'WorkingHourStart') return dayData.workStart || '';
        if (fieldName === 'WorkingHourEnd') return dayData.workEnd || '';
        if (fieldName === 'TotalHourperbaris') return dayData.totalLabel || '';
        if (fieldName === 'Activity') return dayData.activity || '';
        if (fieldName === 'Type') return dayData.type || '';
        if (fieldName === 'Location') return dayData.location || '';
        if (fieldName === 'Skills') return dayData.skills || '';
      }
      if (singleValues.hasOwnProperty(fieldName)) return singleValues[fieldName];
      return '';
    });
  }

  function runExportReport(projectId, signOffData) {
    signOffData = signOffData || {};
    var templates = {};
    try { templates = JSON.parse(localStorage.getItem('QUADRA_PROJECT_TEMPLATES')) || {}; } catch (e) {}
    var tpl = templates[projectId];
    var base64 = tpl ? tpl.dataUrl.split(',')[1] : DEFAULT_TIMESHEET_TEMPLATE_B64;
    var wb = XLSX.read(base64, { type: 'base64' });
    var sheetName = wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var range = XLSX.utils.decode_range(ws['!ref']);

    var includedDays = [];
    currentData.days.forEach(function(d) {
      if (d.dayStatus !== 'Kerja') return;
      var matches = d.entries.filter(function(e) { return e.projectId === projectId; });
      if (!matches.length) return;
      var activity = matches.map(function(e) { return e.activity; }).filter(function(a) { return a; }).join(', ');
      var diff = timeDiffMinutes(d.workStart, d.workEnd);
      includedDays.push({
        date: formatDateDisplay(d.date),
        workStart: d.workStart,
        workEnd: d.workEnd,
        totalLabel: diff > 0 ? formatHM(diff) : '',
        activity: activity,
        type: STATUS_LABELS[d.dayStatus] || d.dayStatus,
        location: '',
        skills: ''
      });
    });

    var stats = computeStats(currentData.days);
    var emp = getEmp(currentBadge);
    var totalNonWeekend = currentData.days.filter(function(d) { return d.dayStatus !== 'Weekend' && d.dayStatus !== 'Holiday'; }).length;
    var attendancePct = totalNonWeekend > 0 ? Math.round((stats.hariKerja / totalNonWeekend) * 100) + '%' : '';

    var project = loadProjectsForTimesheet().find(function(p) { return p.id === projectId; });
    var client = project ? loadClientsForTimesheet().find(function(c) { return c.id === project.clientId; }) : null;

    var singleValues = {
      NamaLengkap: emp ? emp.name : '',
      NIP: currentBadge || '',
      PeriodeMulai: formatDateDisplay(isoDate(currentYear, currentMonth, 1)),
      PeriodeAkhir: formatDateDisplay(isoDate(currentYear, currentMonth, daysInMonth(currentYear, currentMonth))),
      TotalHour: formatHM(stats.totalWorkMins),
      JumlahHariKerja: String(stats.hariKerja),
      JumlahHariPegawaiIjin: String(stats.counts.Ijin),
      JumlahHariPegawaiSakit: String(stats.counts.Sakit),
      JumlahHariPegawaiCuti: String(stats.counts.Cuti),
      JumlahHariPegawaiAlfa: String(stats.counts.Alfa),
      PersentaseKehadiranKaryawan: attendancePct,
      JobPosition: emp ? emp.pos : '',
      DateDOWNLOADTIMESHEET: formatDateDisplay(new Date().toISOString().slice(0, 10)),
      'TandaTanganPegawai+NamaPegawai': emp ? emp.name : '',
      ProjectName: project ? project.name : '',
      ClientName: client ? client.name : '',
      JabatanPemeriksa: signOffData.jabatanPemeriksa || '',
      NamaPemeriksa: signOffData.namaPemeriksa || '',
      JabatanDisetujui: signOffData.jabatanDisetujui || '',
      NamaMenyetujui: signOffData.namaMenyetujui || '',
      Deskripsi: ''
    };

    var daySlotRows = [];
    for (var R = range.s.r; R <= range.e.r; R++) {
      var isDaySlotRow = false;
      for (var C = range.s.c; C <= range.e.c; C++) {
        var cellRef = XLSX.utils.encode_cell({ r: R, c: C });
        var cell = ws[cellRef];
        if (cell && typeof cell.v === 'string' && cell.v.indexOf('[Date]') !== -1) {
          isDaySlotRow = true;
          break;
        }
      }
      if (isDaySlotRow) daySlotRows.push(R);
    }

    var rowToDayData = {};
    daySlotRows.forEach(function(rowIdx, slotIdx) {
      rowToDayData[rowIdx] = includedDays[slotIdx] || null;
    });

    for (var R2 = range.s.r; R2 <= range.e.r; R2++) {
      var isDaySlotRow2 = rowToDayData.hasOwnProperty(R2);
      var dayData = isDaySlotRow2 ? rowToDayData[R2] : null;
      for (var C2 = range.s.c; C2 <= range.e.c; C2++) {
        var ref = XLSX.utils.encode_cell({ r: R2, c: C2 });
        var cell2 = ws[ref];
        if (cell2 && typeof cell2.v === 'string' && cell2.v.indexOf('[') !== -1) {
          var newVal = substitutePlaceholders(cell2.v, dayData, singleValues, isDaySlotRow2);
          cell2.v = newVal;
          cell2.w = newVal;
          cell2.t = 's';
        }
      }
    }

    var baseFileName = 'Report_' + (project ? project.name : 'Project') + '_' + periodLabel(periodKey(currentYear, currentMonth));
    if (pendingExportFormat === 'pdf') {
      generateReportPdf(includedDays, singleValues, baseFileName + '.pdf');
    } else {
      XLSX.writeFile(wb, baseFileName + '.xlsx');
    }
    pendingExportFormat = null;
  }

  // Layout modeled on the reference "Timesheet Penyelesaian Pekerjaan Bulanan"
  // template — identical to my-timesheet.html's generateReportPdf(). Keep
  // both copies in sync if this layout ever changes.
  function generateReportPdf(includedDays, singleValues, fileName) {
    var doc = new jspdf.jsPDF({ orientation: 'landscape' });
    var y = 12;

    doc.setFontSize(13);
    doc.setFont(undefined, 'bold');
    doc.text('MONTHLY TIMESHEET REPORT', 14, y);
    doc.setFont(undefined, 'normal');
    y += 6;

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 9, cellPadding: 2 },
      body: [
        [
          { content: 'Name / Function', styles: { fontStyle: 'bold' } },
          singleValues.NamaLengkap + ' / ' + singleValues.JobPosition,
          { content: 'PT. Steradian Data Optima', rowSpan: 2, styles: { fontStyle: 'bold', halign: 'center', valign: 'middle' } }
        ],
        [
          { content: 'Placement', styles: { fontStyle: 'bold' } },
          singleValues.ClientName
        ]
      ],
      columnStyles: { 0: { cellWidth: 35 }, 1: { cellWidth: 140 }, 2: { cellWidth: 90 } }
    });
    y = doc.lastAutoTable.finalY + 6;

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 7, cellPadding: 1.5, valign: 'middle', halign: 'center' },
      headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' },
      head: [
        [
          { content: 'No.', rowSpan: 2 },
          { content: 'Date', rowSpan: 2 },
          { content: 'Name of Project', rowSpan: 2 },
          { content: 'Location', rowSpan: 2 },
          { content: 'Working Hour', colSpan: 2 },
          { content: 'Total Hour', rowSpan: 2 },
          { content: 'Over Time', colSpan: 2 },
          { content: 'Total OT', rowSpan: 2 },
          { content: 'Detail Activity', rowSpan: 2 }
        ],
        ['Start', 'End', 'Start', 'End']
      ],
      body: includedDays.map(function(d, idx) {
        return [
          String(idx + 1),
          d.date,
          singleValues.ProjectName || '',
          '',
          d.workStart || '',
          d.workEnd || '',
          d.totalLabel || '',
          '',
          '',
          '',
          { content: d.activity || '', styles: { halign: 'left' } }
        ];
      }),
      columnStyles: {
        0: { cellWidth: 8 }, 1: { cellWidth: 18 }, 2: { cellWidth: 38 }, 3: { cellWidth: 22 },
        4: { cellWidth: 15 }, 5: { cellWidth: 15 }, 6: { cellWidth: 16 },
        7: { cellWidth: 15 }, 8: { cellWidth: 15 }, 9: { cellWidth: 14 },
        10: { cellWidth: 'auto' }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    if (y > 175) { doc.addPage(); y = 12; }

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 1.5 },
      body: [
        ['A', 'Permission (days)', singleValues.JumlahHariPegawaiIjin || ''],
        ['B', 'Sick (days)', singleValues.JumlahHariPegawaiSakit || ''],
        ['C', 'Leave (days)', singleValues.JumlahHariPegawaiCuti || ''],
        ['D', 'Total Mandays', singleValues.JumlahHariKerja || ''],
        ['E', 'Total Normal Work Hours', singleValues.TotalHour || ''],
        ['F', 'Total Overtime Hours', '']
      ],
      columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { cellWidth: 60 }, 2: { cellWidth: 30 } },
      tableWidth: 98,
      margin: { left: 14 }
    });
    var summaryEndY = doc.lastAutoTable.finalY;

    doc.setFontSize(8);
    doc.setFont(undefined, 'italic');
    var declaration = doc.splitTextToSize(
      'Declaration: I confirm this time report has been prepared truthfully and accurately, in accordance with the company’s ethical values and professional standards at my placement of ' + (singleValues.ClientName || '-') + '.',
      160
    );
    doc.text(declaration, 120, y + 4);
    doc.setFont(undefined, 'normal');

    y = Math.max(summaryEndY, y + 4 + declaration.length * 4) + 8;
    if (y > 180) { doc.addPage(); y = 12; }

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 3, halign: 'center', minCellHeight: 20 },
      headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' },
      head: [['Approved By (Team Leader)', 'Reviewed By', 'Employee Signature']],
      body: [[
        (singleValues.NamaMenyetujui || '') + (singleValues.JabatanDisetujui ? '\n(' + singleValues.JabatanDisetujui + ')' : '') + '\n\nDate: __________',
        (singleValues.NamaPemeriksa || '') + (singleValues.JabatanPemeriksa ? '\n(' + singleValues.JabatanPemeriksa + ')' : '') + '\n\nDate: __________',
        (singleValues.NamaLengkap || '') + '\n\n\nDate: __________'
      ]]
    });

    doc.save(fileName);
  }

  (function init() {
    seedAllTimesheetsIfNeeded();
    render();
  })();
</script>
