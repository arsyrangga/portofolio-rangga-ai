<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuadraNG — My Timesheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="fields.css" />
  <link rel="stylesheet" href="tags.css" />
  <link rel="stylesheet" href="layout.css" />
  <style>
    .ts-weekend-row td { color: #9CA3AF; background: #F9FAFB; }
    .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #timesheet-tbody td { vertical-align: top; }
    .ts-date-cell-inner { height: 40px; display: flex; align-items: center; }
    .table-wrap thead th { position: sticky; top: 0; z-index: 2; }
    /* Rows are tightly packed here, unlike this component's usual single-dropdown
       pages — the default 240px option panel can visually cover several rows
       below it, and a click landing in that overlap is captured by the open
       panel's own option (standard hit-testing), not the row underneath. Scoped
       shrink (not editing dropdown.js's shared default) reduces that overlap. */
    #timesheet-tbody .select-options { max-height: 110px; }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar" data-active-menu="my-timesheet" data-active-sub="my-timesheet-my-activity"></aside>

<div class="right-panel">

  <header class="navbar">
    <div class="hamburger"><span></span><span></span><span></span></div>
    <div class="navbar-right">
      <div class="nav-action">
        <div class="timer-box" id="clockWidget"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round"/><path d="M10 11l3-3-3-3" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 8H6" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round"/></svg><span>Clock In</span></div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-action">
        <div class="bell-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 00-5 5v3l-1.5 2h13L14 10V7a5 5 0 00-5-5z" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 15a2 2 0 004 0" stroke="#6B7280" stroke-width="1.5"/></svg>
          <div class="bell-badge">0</div>
        </div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-user">
        <div class="user-avatar">SE</div>
        <span class="user-name">Steradian</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </header>

  <nav class="breadcrumb">
    <span class="bc-current">My Timesheet</span>
  </nav>

  <main class="main-content">

    <div class="page-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="page-title" style="white-space:nowrap;">My Timesheet</div>
        <div class="select-w" id="periodSelect" style="width:170px;flex-shrink:0;"></div>
        <span class="tag" id="periodStatusTag"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" onclick="openExportTypeModal()">Export</button>
        <button class="btn btn-outline" id="importBtn" onclick="document.getElementById('importFileInput').click()">Import</button>
        <input type="file" id="importFileInput" accept=".xlsx" style="display:none" onchange="handleImportFile(this.files[0])" />
        <button class="btn btn-primary" id="submitTimesheetBtn" onclick="submitTimesheet()">Submit</button>
      </div>
    </div>

    <div class="section-err muted" id="rejectionReasonNote">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:1px"><path d="M8 1.5L1.5 13.5h13L8 1.5z" stroke="#991B1B" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.5" stroke="#991B1B" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11" r="0.7" fill="#991B1B"/></svg>
      <div>
        <div style="font-weight:600;">Rejected</div>
        <div id="rejectionReasonText" style="margin-top:2px;"></div>
      </div>
    </div>

    <div class="stat-row flex">
      <div class="stat-card">
        <div class="stat-label">Total Work Hours</div>
        <div class="stat-value" id="statTotalWork">0h 00m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Days Worked</div>
        <div class="stat-value" id="statHariKerja">0</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">Days Absent</div>
        <div class="stat-value" id="statAbsent">0</div>
        <div class="stat-sub" id="statAbsentSub">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Status</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Total Hours</th>
            <th>Project</th>
            <th>Activity</th>
            <th class="col-actions" style="width:60px"></th>
          </tr>
        </thead>
        <tbody id="timesheet-tbody"></tbody>
      </table>
    </div>

  </main>
</div>

<div class="modal-overlay" id="export-type-format-modal" onclick="if(event.target===this)closeExportTypeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export</span>
      <button class="modal-close-btn" onclick="closeExportTypeModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Type</div>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="export-type" value="timesheet" checked><div class="radio-dot"></div><span>Timesheet</span></label>
          <label class="radio-option"><input type="radio" name="export-type" value="report"><div class="radio-dot"></div><span>Report</span></label>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="field-label">Format</div>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="export-format" value="xlsx" checked><div class="radio-dot"></div><span>xlsx</span></label>
          <label class="radio-option"><input type="radio" name="export-format" value="pdf"><div class="radio-dot"></div><span>PDF</span></label>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportTypeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportTypeFormat()">Continue</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="export-report-signoff-modal" onclick="if(event.target===this)closeExportReportSignOffModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export Report</span>
      <button class="modal-close-btn" onclick="closeExportReportSignOffModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Reviewed By</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="text-input" id="export-report-jabatan-pemeriksa" placeholder="Position" style="flex:1;" />
          <input type="text" class="text-input" id="export-report-nama-pemeriksa" placeholder="Name" style="flex:1;" />
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="field-label">Approved By</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="text-input" id="export-report-jabatan-disetujui" placeholder="Position" style="flex:1;" />
          <input type="text" class="text-input" id="export-report-nama-menyetujui" placeholder="Name" style="flex:1;" />
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportReportSignOffModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportReportSignOff()">Continue</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="export-report-modal" onclick="if(event.target===this)closeExportReportModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">Export Report</span>
      <button class="modal-close-btn" onclick="closeExportReportModal()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Project</div>
        <div class="select-w" id="export-report-project-select"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeExportReportModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmExportReportProject()">Export</button>
    </div>
  </div>
</div>

<script src="employees-data.js"></script>
<script src="timesheet-seed.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="dropdown.js"></script>

        workStart: dayStatus === 'Kerja' ? '08:00' : '',
        workEnd: dayStatus === 'Kerja' ? '17:00' : '',
        entries: dayStatus === 'Kerja' ? [{ projectId: null, activity: '' }] : []
      });
    }
    return days;
  }

  function timesheetKey(badge, year, month) {
    return 'quadra_timesheet_' + badge + '_' + periodKey(year, month);
  }

  function saveTimesheet(badge, year, month, data) {
    localStorage.setItem(timesheetKey(badge, year, month), JSON.stringify(data));
  }

  function loadTimesheet(badge, year, month) {
    var key = timesheetKey(badge, year, month);
    try {
      var raw = localStorage.getItem(key);
      if (raw) {
        var parsed = JSON.parse(raw);
        parsed.days = parsed.days.map(timesheetNormalizeDay);
        return parsed;
      }
    } catch (e) {}
    var seeded = (year === 2026 && month === 6) ? buildJuly2026Seed(badge) : null;
    var fresh = seeded || { status: 'Draft', submittedAt: null, days: generateDefaultDays(year, month) };
    saveTimesheet(badge, year, month, fresh);
    return fresh;
  }

  var SELF_SERVICE_HISTORY_MONTHS = 12;

  // True for the current month and up to (SELF_SERVICE_HISTORY_MONTHS - 1) months back;
  // future dates are intentionally still allowed (this window only restricts looking back).
  function isWithinSelfServiceHistoryWindow(y, m) {
    var now = new Date();
    var monthsAgo = (now.getFullYear() - y) * 12 + (now.getMonth() - m);
    return monthsAgo < SELF_SERVICE_HISTORY_MONTHS;
  }

  function listExistingPeriods(badge) {
    var prefix = 'quadra_timesheet_' + badge + '_';
    var periods = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) periods.push(k.slice(prefix.length));
    }
    var now = new Date();
    var currentPk = periodKey(now.getFullYear(), now.getMonth());
    if (periods.indexOf(currentPk) === -1) periods.push(currentPk);
    periods = periods.filter(function(pk) {
      var parts = pk.split('-');
      return isWithinSelfServiceHistoryWindow(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1);
    });
    periods.sort();
    periods.reverse();
    // No count cap here: the window filter above already bounds how far back
    // the list goes, and future-dated periods are deliberately allowed — a
    // trailing slice() would silently drop the oldest legitimate month once
    // any future period exists.
    return periods;
  }

  var PROJECT_SEED_FALLBACK = [
    { id: 1, name: 'NDS', clientId: 1 },
    { id: 2, name: 'CRM', clientId: 1 },
    { id: 3, name: 'Ops Console', clientId: 2 }
  ];

  // settings.html owns QUADRA_PROJECTS and its version key QUADRA_PROJECTS_V.
  // This page is only a consumer: it seeds a fallback when the key has never
  // been written at all (Settings never opened in this browser), and it must
  // NOT write the version key or react to it — otherwise a future Settings v2
  // seed and this v1 fallback would keep overwriting each other on every visit.
  function loadProjectsForTimesheet() {
    if (localStorage.getItem('QUADRA_PROJECTS') === null) {
      localStorage.setItem('QUADRA_PROJECTS', JSON.stringify(PROJECT_SEED_FALLBACK));
      return PROJECT_SEED_FALLBACK.slice();
    }
    try { return JSON.parse(localStorage.getItem('QUADRA_PROJECTS')) || []; } catch (e) { return []; }
  }

  function loadClientsForTimesheet() {
    try { return JSON.parse(localStorage.getItem('QUADRA_CLIENTS')) || []; } catch (e) { return []; }
  }

  function timeDiffMinutes(fromVal, toVal) {
    if (!fromVal || !toVal) return 0;
    var fp = fromVal.split(':'), tp = toVal.split(':');
    var fromMins = parseInt(fp[0], 10) * 60 + parseInt(fp[1], 10);
    var toMins   = parseInt(tp[0], 10) * 60 + parseInt(tp[1], 10);
    var diff = toMins - fromMins;
    if (diff < 0) diff += 24 * 60;
    return diff;
  }

  function formatHM(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h ' + pad2(m) + 'm';
  }

  function computeStats(days) {
    var totalWorkMins = 0, hariKerja = 0;
    var counts = { Ijin: 0, Sakit: 0, Cuti: 0, Alfa: 0 };
    days.forEach(function(d) {
      if (d.dayStatus === 'Kerja') {
        hariKerja++;
        totalWorkMins += timeDiffMinutes(d.workStart, d.workEnd);
      } else if (counts.hasOwnProperty(d.dayStatus)) {
        counts[d.dayStatus]++;
      }
    });
    var absentTotal = counts.Ijin + counts.Sakit + counts.Cuti + counts.Alfa;
    var breakdown = ['Ijin', 'Sakit', 'Cuti', 'Alfa'].filter(function(k) { return counts[k] > 0; })
      .map(function(k) { return counts[k] + ' ' + STATUS_LABELS[k]; }).join(' · ');
    if (!breakdown) breakdown = '—';
    return { totalWorkMins: totalWorkMins, hariKerja: hariKerja, absentTotal: absentTotal, breakdown: breakdown, counts: counts };
  }

  var currentBadge = null;
  var currentYear, currentMonth;
  var currentData = null;

  function getEmp(badge) {
    return QUADRA_EMPLOYEES.find(function(e) { return e.badge === badge; }) || null;
  }

  function buildTimesheetRows() {
    var rows = [['Date', 'Status', 'Start Time', 'End Time', 'Total Hours', 'Project', 'Activity']];
    var projects = loadProjectsForTimesheet();

    currentData.days.forEach(function(d) {
      var statusLabel = STATUS_LABELS[d.dayStatus] || d.dayStatus;
      if (d.dayStatus !== 'Kerja') {
        rows.push([formatDateDisplay(d.date), statusLabel, '', '', '', '', '']);
        return;
      }
      var diff = timeDiffMinutes(d.workStart, d.workEnd);
      var totalLabel = diff > 0 ? formatHM(diff) : '';
      if (!d.entries.length) {
        rows.push([formatDateDisplay(d.date), statusLabel, d.workStart, d.workEnd, totalLabel, '', '']);
      } else {
        d.entries.forEach(function(entry) {
          var proj = projects.find(function(p) { return p.id === entry.projectId; });
          rows.push([formatDateDisplay(d.date), statusLabel, d.workStart, d.workEnd, totalLabel, proj ? proj.name : '', entry.activity]);
        });
      }
    });

    return rows;
  }

  function exportTimesheet() {
    var rows = buildTimesheetRows();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Timesheet');
    XLSX.writeFile(wb, 'Timesheet_' + periodLabel(periodKey(currentYear, currentMonth)) + '.xlsx');
  }

  function exportTimesheetPdf() {
    var rows = buildTimesheetRows();
    var doc = new jspdf.jsPDF();
    var y = 15;
    var xPositions = [14, 45, 65, 85, 108, 130, 155];

    doc.setFontSize(14);
    doc.text('Timesheet', 14, y);
    y += 8;

    doc.setFontSize(9);
    rows[0].forEach(function(h, i) { doc.text(h, xPositions[i], y); });
    y += 5;
    doc.line(14, y, 196, y);
    y += 5;

    for (var i = 1; i < rows.length; i++) {
      if (y > 270) { doc.addPage(); y = 15; }
      rows[i].forEach(function(cell, idx) {
        var text = String(cell || '');
        if (idx === 6) {
          var fitted = doc.splitTextToSize(text, 45);
          text = fitted[0] + (fitted.length > 1 ? '...' : '');
        }
        doc.text(text, xPositions[idx], y);
      });
      y += 6;
    }

    doc.save('Timesheet_' + periodLabel(periodKey(currentYear, currentMonth)) + '.pdf');
  }

  function getDistinctProjectIdsInPeriod() {
    var ids = [];
    currentData.days.forEach(function(d) {
      if (d.dayStatus !== 'Kerja') return;
      d.entries.forEach(function(entry) {
        if (entry.projectId != null && ids.indexOf(entry.projectId) === -1) ids.push(entry.projectId);
      });
    });
    return ids;
  }

  var exportReportProjectIds = null;
  var pendingSignOffData = null;
  var pendingExportFormat = null;

  function openExportTypeModal() {
    document.querySelector('input[name="export-type"][value="timesheet"]').checked = true;
    document.querySelector('input[name="export-format"][value="xlsx"]').checked = true;
    document.getElementById('export-type-format-modal').classList.add('show');
  }

  function closeExportTypeModal() {
    document.getElementById('export-type-format-modal').classList.remove('show');
  }

  function confirmExportTypeFormat() {
    var type = document.querySelector('input[name="export-type"]:checked').value;
    var format = document.querySelector('input[name="export-format"]:checked').value;
    closeExportTypeModal();
    pendingExportFormat = format;

    if (type === 'timesheet') {
      if (format === 'pdf') { exportTimesheetPdf(); } else { exportTimesheet(); }
    } else {
      exportReport();
    }
  }

  function exportReport() {
    var projectIds = getDistinctProjectIdsInPeriod();
    if (!projectIds.length) {
      QuadraToast.show('No project data to export.', 'error');
      return;
    }
    exportReportProjectIds = projectIds;
    document.getElementById('export-report-jabatan-pemeriksa').value = '';
    document.getElementById('export-report-nama-pemeriksa').value = '';
    document.getElementById('export-report-jabatan-disetujui').value = '';
    document.getElementById('export-report-nama-menyetujui').value = '';
    document.getElementById('export-report-signoff-modal').classList.add('show');
  }

  function closeExportReportSignOffModal() {
    document.getElementById('export-report-signoff-modal').classList.remove('show');
  }

  function confirmExportReportSignOff() {
    var signOffData = {
      jabatanPemeriksa: document.getElementById('export-report-jabatan-pemeriksa').value || '',
      namaPemeriksa: document.getElementById('export-report-nama-pemeriksa').value || '',
      jabatanDisetujui: document.getElementById('export-report-jabatan-disetujui').value || '',
      namaMenyetujui: document.getElementById('export-report-nama-menyetujui').value || ''
    };
    closeExportReportSignOffModal();

    if (exportReportProjectIds.length === 1) {
      runExportReport(exportReportProjectIds[0], signOffData);
    } else {

  function openExportReportProjectModal(projectIds, signOffData) {
    pendingSignOffData = signOffData;
    var allProjects = loadProjectsForTimesheet();
    var options = projectIds.map(function(id) {
      var p = allProjects.find(function(pr) { return pr.id === id; });
      return { value: id, label: p ? p.name : ('Project ' + id) };

    });

  function closeExportReportModal() {
    document.getElementById('export-report-modal').classList.remove('show');
  }

  function confirmExportReportProject() {
    var projectId = QuadraDropdown.getValue(document.getElementById('export-report-project-select'));
    closeExportReportModal();
    runExportReport(parseInt(projectId, 10), pendingSignOffData);
    pendingSignOffData = null;
  }

  var PER_DAY_FIELDS = ['Date', 'WorkingHourStart', 'WorkingHourEnd', 'TotalHourperbaris', 'Activity', 'Type', 'Location', 'Skills'];

  function substitutePlaceholders(text, dayData, singleValues, isDaySlotRow) {
    return text.replace(/\[([A-Za-z0-9_+]+)\]/g, function(match, fieldName) {
      if (isDaySlotRow && !dayData) return '';
      if (PER_DAY_FIELDS.indexOf(fieldName) !== -1) {
        if (!dayData) return '';
        if (fieldName === 'Date') return dayData.date;
        if (fieldName === 'WorkingHourStart') return dayData.workStart || '';
        if (fieldName === 'WorkingHourEnd') return dayData.workEnd || '';
        if (fieldName === 'TotalHourperbaris') return dayData.totalLabel || '';
        if (fieldName === 'Activity') return dayData.activity || '';
        if (fieldName === 'Type') return dayData.type || '';
        if (fieldName === 'Location') return dayData.location || '';
        if (fieldName === 'Skills') return dayData.skills || '';
      }
      if (singleValues.hasOwnProperty(fieldName)) return singleValues[fieldName];
      return '';
    });
  }

  function runExportReport(projectId, signOffData) {
    signOffData = signOffData || {};
    var templates = {};
    try { templates = JSON.parse(localStorage.getItem('QUADRA_PROJECT_TEMPLATES')) || {}; } catch (e) {}
    var tpl = templates[projectId];
    var base64 = tpl ? tpl.dataUrl.split(',')[1] : DEFAULT_TIMESHEET_TEMPLATE_B64;
    var wb = XLSX.read(base64, { type: 'base64' });
    var sheetName = wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var range = XLSX.utils.decode_range(ws['!ref']);

    var includedDays = [];
    currentData.days.forEach(function(d) {
      if (d.dayStatus !== 'Kerja') return;
      var matches = d.entries.filter(function(e) { return e.projectId === projectId; });
      if (!matches.length) return;
      var activity = matches.map(function(e) { return e.activity; }).filter(function(a) { return a; }).join(', ');
      var diff = timeDiffMinutes(d.workStart, d.workEnd);
      includedDays.push({
        date: formatDateDisplay(d.date),
        workStart: d.workStart,
        workEnd: d.workEnd,
        totalLabel: diff > 0 ? formatHM(diff) : '',
        activity: activity,
        type: STATUS_LABELS[d.dayStatus] || d.dayStatus,
        location: '',
        skills: ''
      });
    });

    var stats = computeStats(currentData.days);
    var emp = getEmp(currentBadge);
    var totalNonWeekend = currentData.days.filter(function(d) { return d.dayStatus !== 'Weekend' && d.dayStatus !== 'Holiday'; }).length;
    var attendancePct = totalNonWeekend > 0 ? Math.round((stats.hariKerja / totalNonWeekend) * 100) + '%' : '';

    var project = loadProjectsForTimesheet().find(function(p) { return p.id === projectId; });
    var client = project ? loadClientsForTimesheet().find(function(c) { return c.id === project.clientId; }) : null;

    var singleValues = {
      NamaLengkap: emp ? emp.name : '',
      NIP: currentBadge || '',
      PeriodeMulai: formatDateDisplay(isoDate(currentYear, currentMonth, 1)),
      PeriodeAkhir: formatDateDisplay(isoDate(currentYear, currentMonth, daysInMonth(currentYear, currentMonth))),
      TotalHour: formatHM(stats.totalWorkMins),
      JumlahHariKerja: String(stats.hariKerja),
      JumlahHariPegawaiIjin: String(stats.counts.Ijin),
      JumlahHariPegawaiSakit: String(stats.counts.Sakit),
      JumlahHariPegawaiCuti: String(stats.counts.Cuti),
      JumlahHariPegawaiAlfa: String(stats.counts.Alfa),
      PersentaseKehadiranKaryawan: attendancePct,
      JobPosition: emp ? emp.pos : '',
      DateDOWNLOADTIMESHEET: formatDateDisplay(new Date().toISOString().slice(0, 10)),
      'TandaTanganPegawai+NamaPegawai': emp ? emp.name : '',
      ProjectName: project ? project.name : '',
      ClientName: client ? client.name : '',
      JabatanPemeriksa: signOffData.jabatanPemeriksa || '',
      NamaPemeriksa: signOffData.namaPemeriksa || '',
      JabatanDisetujui: signOffData.jabatanDisetujui || '',
      NamaMenyetujui: signOffData.namaMenyetujui || '',
      Deskripsi: ''
    };

    var daySlotRows = [];
    for (var R = range.s.r; R <= range.e.r; R++) {
      var isDaySlotRow = false;
      for (var C = range.s.c; C <= range.e.c; C++) {
        var cellRef = XLSX.utils.encode_cell({ r: R, c: C });
        var cell = ws[cellRef];
        if (cell && typeof cell.v === 'string' && cell.v.indexOf('[Date]') !== -1) {
          isDaySlotRow = true;
          break;
        }
      }
      if (isDaySlotRow) daySlotRows.push(R);
    }

    var rowToDayData = {};
    daySlotRows.forEach(function(rowIdx, slotIdx) {
      rowToDayData[rowIdx] = includedDays[slotIdx] || null;
    });

    for (var R2 = range.s.r; R2 <= range.e.r; R2++) {
      var isDaySlotRow = rowToDayData.hasOwnProperty(R2);
      var dayData = isDaySlotRow ? rowToDayData[R2] : null;
      for (var C2 = range.s.c; C2 <= range.e.c; C2++) {
        var ref = XLSX.utils.encode_cell({ r: R2, c: C2 });
        var cell2 = ws[ref];
        if (cell2 && typeof cell2.v === 'string' && cell2.v.indexOf('[') !== -1) {
          var newVal = substitutePlaceholders(cell2.v, dayData, singleValues, isDaySlotRow);
          cell2.v = newVal;
          cell2.w = newVal;
          cell2.t = 's';
        }
      }
    }

    var baseFileName = 'Report_' + (project ? project.name : 'Project') + '_' + periodLabel(periodKey(currentYear, currentMonth));
    if (pendingExportFormat === 'pdf') {
      generateReportPdf(includedDays, singleValues, baseFileName + '.pdf');
    } else {
      XLSX.writeFile(wb, baseFileName + '.xlsx');
    }
    pendingExportFormat = null;
  }

  // Layout modeled on the reference "Timesheet Penyelesaian Pekerjaan Bulanan"
  // template (template-timesheet/Timesheet_PPO.xlsx, rendered example at
  // template-timesheet/Timesheet - PPO.pdf) — a real bordered/gridded table,
  // not floating text, built with jspdf-autotable. Landscape orientation since
  // the reference itself is a wide multi-column grid. All visible text is
  // translated to English per this app's UI-language rule; only the structure
  // (sections, columns, merged header cells) is copied from the reference.
  // Overtime columns are always blank — this app's data model doesn't track
  // overtime (an explicit, earlier product decision), and notably the
  // reference's own real-world data also leaves every Over Time cell blank.
  function generateReportPdf(includedDays, singleValues, fileName) {
    var doc = new jspdf.jsPDF({ orientation: 'landscape' });
    var y = 12;

    doc.setFontSize(13);
    doc.setFont(undefined, 'bold');
    doc.text('MONTHLY TIMESHEET REPORT', 14, y);
    doc.setFont(undefined, 'normal');
    y += 6;

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 9, cellPadding: 2 },
      body: [
        [
          { content: 'Name / Function', styles: { fontStyle: 'bold' } },
          singleValues.NamaLengkap + ' / ' + singleValues.JobPosition,
          { content: 'PT. Steradian Data Optima', rowSpan: 2, styles: { fontStyle: 'bold', halign: 'center', valign: 'middle' } }
        ],
        [
          { content: 'Placement', styles: { fontStyle: 'bold' } },
          singleValues.ClientName
        ]
      ],
      columnStyles: { 0: { cellWidth: 35 }, 1: { cellWidth: 140 }, 2: { cellWidth: 90 } }
    });
    y = doc.lastAutoTable.finalY + 6;

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 7, cellPadding: 1.5, valign: 'middle', halign: 'center' },
      headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' },
      head: [
        [
          { content: 'No.', rowSpan: 2 },
          { content: 'Date', rowSpan: 2 },
          { content: 'Name of Project', rowSpan: 2 },
          { content: 'Location', rowSpan: 2 },
          { content: 'Working Hour', colSpan: 2 },
          { content: 'Total Hour', rowSpan: 2 },
          { content: 'Over Time', colSpan: 2 },
          { content: 'Total OT', rowSpan: 2 },
          { content: 'Detail Activity', rowSpan: 2 }
        ],
        ['Start', 'End', 'Start', 'End']
      ],
      body: includedDays.map(function(d, idx) {
        return [
          String(idx + 1),
          d.date,
          singleValues.ProjectName || '',
          '',
          d.workStart || '',
          d.workEnd || '',
          d.totalLabel || '',
          '',
          '',
          '',
          { content: d.activity || '', styles: { halign: 'left' } }
        ];
      }),
      columnStyles: {
        0: { cellWidth: 8 }, 1: { cellWidth: 18 }, 2: { cellWidth: 38 }, 3: { cellWidth: 22 },
        4: { cellWidth: 15 }, 5: { cellWidth: 15 }, 6: { cellWidth: 16 },
        7: { cellWidth: 15 }, 8: { cellWidth: 15 }, 9: { cellWidth: 14 },
        10: { cellWidth: 'auto' }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    if (y > 175) { doc.addPage(); y = 12; }

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 1.5 },
      body: [
        ['A', 'Permission (days)', singleValues.JumlahHariPegawaiIjin || ''],
        ['B', 'Sick (days)', singleValues.JumlahHariPegawaiSakit || ''],
        ['C', 'Leave (days)', singleValues.JumlahHariPegawaiCuti || ''],
        ['D', 'Total Mandays', singleValues.JumlahHariKerja || ''],
        ['E', 'Total Normal Work Hours', singleValues.TotalHour || ''],
        ['F', 'Total Overtime Hours', '']
      ],
      columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { cellWidth: 60 }, 2: { cellWidth: 30 } },
      tableWidth: 98,
      margin: { left: 14 }
    });
    var summaryEndY = doc.lastAutoTable.finalY;

    doc.setFontSize(8);
    doc.setFont(undefined, 'italic');
    var declaration = doc.splitTextToSize(
      'Declaration: I confirm this time report has been prepared truthfully and accurately, in accordance with the company’s ethical values and professional standards at my placement of ' + (singleValues.ClientName || '-') + '.',
      160
    );
    doc.text(declaration, 120, y + 4);
    doc.setFont(undefined, 'normal');

    y = Math.max(summaryEndY, y + 4 + declaration.length * 4) + 8;
    if (y > 180) { doc.addPage(); y = 12; }

    doc.autoTable({
      startY: y,
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 3, halign: 'center', minCellHeight: 20 },
      headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' },
      head: [['Approved By (Team Leader)', 'Reviewed By', 'Employee Signature']],
      body: [[
        (singleValues.NamaMenyetujui || '') + (singleValues.JabatanDisetujui ? '\n(' + singleValues.JabatanDisetujui + ')' : '') + '\n\nDate: __________',
        (singleValues.NamaPemeriksa || '') + (singleValues.JabatanPemeriksa ? '\n(' + singleValues.JabatanPemeriksa + ')' : '') + '\n\nDate: __________',
        (singleValues.NamaLengkap || '') + '\n\n\nDate: __________'
      ]]
    });

    doc.save(fileName);
  }

  function findWorklogSheetName(wb) {
    for (var i = 0; i < wb.SheetNames.length; i++) {
      var name = wb.SheetNames[i];
      var headerRow = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 })[0] || [];
      if (headerRow.indexOf('Work date') !== -1) return name;
    }
    return wb.SheetNames[0];
  }

  function processImportRows(rows) {
    var byDate = {};
    rows.forEach(function(row) {
      if (row['Work Type'] === 'Ishoma') return;
      var workDate = row['Work date'];
      if (!workDate) return;
      var d = (workDate instanceof Date) ? workDate : new Date(workDate);
      if (isNaN(d.getTime())) return;
      var iso = isoDate(d.getFullYear(), d.getMonth(), d.getDate());
      if (!byDate[iso]) byDate[iso] = [];
      byDate[iso].push({
        projectName: row['Project Name'] || '',
        activity: row['Work Description'] || '',
        hours: parseFloat(row['Hours']) || 0
      });
    });

    var dates = Object.keys(byDate).sort();
    if (!dates.length) {
      QuadraToast.show('No importable rows found in this file.', 'error');
      return;
    }

    var projects = loadProjectsForTimesheet();
    var importedCount = 0, skippedLockedCount = 0, skippedOutOfWindowCount = 0;
    var skippedNonWorkDayCount = 0, overwrittenAbsenceCount = 0;
    var lastImportedYear = null, lastImportedMonth = null;

    dates.forEach(function(iso) {
      var parts = iso.split('-').map(function(n) { return parseInt(n, 10); });
      var y = parts[0], m = parts[1] - 1;
      if (!isWithinSelfServiceHistoryWindow(y, m)) { skippedOutOfWindowCount++; return; }
      var data = loadTimesheet(currentBadge, y, m);
      if (data.status === 'Submitted' || data.status === 'Approved') { skippedLockedCount++; return; }

      var day = data.days.find(function(d) { return d.date === iso; });
      // Defensive only: `iso` is built from y/m above and loadTimesheet()
      // always generates every day of that month, so this can't be hit with
      // well-formed data — nothing worth reporting to the user.
      if (!day) return;
      if (day.dayStatus === 'Weekend' || day.dayStatus === 'Holiday') { skippedNonWorkDayCount++; return; }
      if (['Ijin', 'Sakit', 'Cuti', 'Alfa'].indexOf(day.dayStatus) !== -1) { overwrittenAbsenceCount++; }

      var rowsForDay = byDate[iso];
      var totalMins = rowsForDay.reduce(function(sum, r) { return sum + Math.round(r.hours * 60); }, 0);
      var totalH = Math.floor(totalMins / 60), totalM = totalMins % 60;
      var endHour = 9 + totalH, endMin = totalM;
      if (endMin >= 60) { endHour++; endMin -= 60; }

      day.dayStatus = 'Kerja';
      day.workStart = '09:00';
      day.workEnd = pad2(endHour % 24) + ':' + pad2(endMin);
      day.entries = rowsForDay.map(function(r) {
        var proj = projects.find(function(p) { return p.name.toLowerCase() === r.projectName.toLowerCase(); });
        return { projectId: proj ? proj.id : null, activity: r.activity };
      });

      saveTimesheet(currentBadge, y, m, data);
      importedCount++;
      lastImportedYear = y;
      lastImportedMonth = m;
    });

    var summary = 'Imported ' + importedCount + ' day(s)' +
      (skippedLockedCount ? ', ' + skippedLockedCount + ' skipped (already submitted or approved)' : '') +
      (skippedOutOfWindowCount ? ', ' + skippedOutOfWindowCount + ' skipped (older than ' + SELF_SERVICE_HISTORY_MONTHS + ' months)' : '') +
      (skippedNonWorkDayCount ? ', ' + skippedNonWorkDayCount + ' skipped (Weekend/Holiday)' : '') +
      (overwrittenAbsenceCount ? ', ' + overwrittenAbsenceCount + ' absence day(s) overwritten' : '') + '.';
    // Overwriting Ijin/Sakit/Cuti/Alfa days with Kerja is destructive, so it
    // gets a warning tone even when the import otherwise succeeded.
    var toastType = importedCount === 0 ? 'error' : (overwrittenAbsenceCount > 0 ? 'warning' : 'success');
    QuadraToast.show(summary, toastType);

    if (importedCount > 0) {
      currentYear = lastImportedYear;
      currentMonth = lastImportedMonth;
      currentData = loadTimesheet(currentBadge, currentYear, currentMonth);
      renderTimesheetPage();
    }
  }

  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: 'array', cellDates: true });
      var sheetName = findWorklogSheetName(wb);
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
      processImportRows(rows);
    };
    reader.readAsArrayBuffer(file);
    document.getElementById('importFileInput').value = '';
  }

  function renderPeriodSelect() {
    var el = document.getElementById('periodSelect');
    var periods = listExistingPeriods(currentBadge);
    var activePk = periodKey(currentYear, currentMonth);
    var options = periods.map(function(pk) { return { value: pk, label: periodLabel(pk) }; });
    QuadraDropdown.init(el, options, {
      value: activePk,
      onChange: function(value) { onPeriodChange(value); }
    });
  }

  function renderStatusTag() {
    var tag = document.getElementById('periodStatusTag');
    var btn = document.getElementById('submitTimesheetBtn');
    var importBtn = document.getElementById('importBtn');
    var reasonNote = document.getElementById('rejectionReasonNote');

    if (currentData.status === 'Submitted') {
      tag.className = 'tag tag-warning';
      tag.textContent = 'Submitted';
      btn.disabled = true;
      btn.title = 'Already submitted';
      importBtn.disabled = true;
      importBtn.title = 'This period is already submitted';
    } else if (currentData.status === 'Approved') {
      tag.className = 'tag tag-success';
      tag.textContent = 'Approved';
      btn.disabled = true;
      btn.title = 'Already approved';
      importBtn.disabled = true;
      importBtn.title = 'This period is already approved';
    } else if (currentData.status === 'Rejected') {
      tag.className = 'tag tag-danger';
      tag.textContent = 'Rejected';
      btn.disabled = false;
      btn.title = '';
      importBtn.disabled = false;
      importBtn.title = '';
    } else {
      tag.className = 'tag tag-neutral';
      tag.textContent = 'Draft';
      btn.disabled = false;
      btn.title = '';
      importBtn.disabled = false;
      importBtn.title = '';
    }

    if (currentData.status === 'Rejected' && currentData.rejectionReason) {
      document.getElementById('rejectionReasonText').textContent = currentData.rejectionReason;
      reasonNote.classList.add('show');
    } else {
      reasonNote.classList.remove('show');
    }
  }

  function renderStatRow() {
    var stats = computeStats(currentData.days);
    document.getElementById('statTotalWork').textContent = formatHM(stats.totalWorkMins);
    document.getElementById('statHariKerja').textContent = stats.hariKerja;
    document.getElementById('statAbsent').textContent = stats.absentTotal;
    document.getElementById('statAbsentSub').textContent = stats.breakdown;
  }

  function buildDayRows(d, isLocked) {
    if (d.dayStatus === 'Weekend') {
      return '<tr class="ts-weekend-row">' +
        '<td>' + formatDateDisplay(d.date) + '</td>' +
        '<td colspan="7">Weekend</td>' +
      '</tr>';
    }

    if (d.dayStatus === 'Holiday') {
      return '<tr class="ts-weekend-row">' +
        '<td>' + formatDateDisplay(d.date) + '</td>' +
        '<td colspan="7">Holiday — ' + timesheetEscHtml(d.holidayName || '') + '</td>' +
      '</tr>';
    }

    if (d.dayStatus !== 'Kerja') {
      return '<tr>' +
        '<td>' + formatDateDisplay(d.date) + '</td>' +
        '<td><div class="select-w' + (isLocked ? ' is-disabled' : '') + '" id="status-select-' + d.date + '" style="width:130px;"></div></td>' +
        '<td colspan="6"></td>' +
      '</tr>';
    }

    var n = d.entries.length;
    var fieldDisabled = isLocked ? ' disabled' : '';
    var workDiff = timeDiffMinutes(d.workStart, d.workEnd);
    var rows = '';

    var rowspan = n + 1;

    d.entries.forEach(function(entry, idx) {
      var removeDisabled = (n === 1 || isLocked) ? ' disabled' : '';

      rows += '<tr>';
      if (idx === 0) {
        rows +=
          '<td rowspan="' + rowspan + '"><div class="ts-date-cell-inner">' + formatDateDisplay(d.date) + '</div></td>' +
          '<td rowspan="' + rowspan + '"><div class="select-w' + (isLocked ? ' is-disabled' : '') + '" id="status-select-' + d.date + '" style="width:130px;"></div></td>' +
          '<td rowspan="' + rowspan + '"><div class="time-input-w"><input type="time" value="' + d.workStart + '" class="' + (d.workStart ? 'has-value' : '') + '" onchange="onDayFieldChange(\'' + d.date + '\', \'workStart\', this.value)"' + fieldDisabled + ' /></div></td>' +
          '<td rowspan="' + rowspan + '"><div class="time-input-w"><input type="time" value="' + d.workEnd + '" class="' + (d.workEnd ? 'has-value' : '') + '" onchange="onDayFieldChange(\'' + d.date + '\', \'workEnd\', this.value)"' + fieldDisabled + ' /></div></td>' +
          '<td rowspan="' + rowspan + '"><span class="time-calc-badge' + (workDiff > 0 ? ' active' : '') + '">= ' + (workDiff > 0 ? formatHM(workDiff) : '0 hrs') + '</span></td>';
      }
      rows +=
        '<td><div class="select-w' + (fieldDisabled ? ' is-disabled' : '') + '" id="project-select-' + d.date + '-' + idx + '"></div></td>' +
        '<td><input type="text" class="text-input" value="' + timesheetEscHtml(entry.activity) + '" onchange="onEntryFieldChange(\'' + d.date + '\', ' + idx + ', \'activity\', this.value)"' + fieldDisabled + ' /></td>' +
        '<td><button type="button" class="icon-btn" title="Remove entry" onclick="removeEntry(\'' + d.date + '\', ' + idx + ')"' + removeDisabled + '><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></td>';
      rows += '</tr>';
    });

    rows += '<tr>' +
      '<td><button type="button" class="btn btn-outline" onclick="addEntry(\'' + d.date + '\')"' + (isLocked ? ' disabled' : '') + '>+ Add Entry</button></td>' +
    '</tr>';

    return rows;
  }

  function renderTimesheetPage() {
    renderPeriodSelect();
    renderStatusTag();
    renderStatRow();

    var tbody = document.getElementById('timesheet-tbody');
    var isLocked = currentData.status === 'Submitted' || currentData.status === 'Approved';
    var projects = loadProjectsForTimesheet();

    tbody.innerHTML = currentData.days.map(function(d) {
      return buildDayRows(d, isLocked);
    }).join('');

    var statusOptions  = ['Kerja', 'Ijin', 'Sakit', 'Cuti', 'Alfa'].map(function(s) { return { value: s, label: STATUS_LABELS[s] }; });
    var projectOptions = projects.map(function(p) { return { value: p.id, label: p.name }; });

    currentData.days.forEach(function(d) {
      if (d.dayStatus === 'Weekend' || d.dayStatus === 'Holiday') return;

      QuadraDropdown.init(document.getElementById('status-select-' + d.date), statusOptions, {
        value: d.dayStatus,
        onChange: function(value) { onDayStatusChange(d.date, value); }
      });

      if (d.dayStatus === 'Kerja') {
        d.entries.forEach(function(entry, idx) {
          QuadraDropdown.init(document.getElementById('project-select-' + d.date + '-' + idx), projectOptions, {
            placeholder: 'Select project',
            value: entry.projectId,
            onChange: function(value) { onEntryFieldChange(d.date, idx, 'projectId', value ? parseInt(value, 10) : null); }
          });
        });
      }
    });
  }

  function findDay(date) {
    return currentData.days.find(function(d) { return d.date === date; });
  }

  function onDayFieldChange(date, field, value) {
    var day = findDay(date);
    if (!day) return;
    day[field] = value;
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
  }

  function onEntryFieldChange(date, entryIndex, field, value) {
    var day = findDay(date);
    if (!day) return;
    var entry = day.entries[entryIndex];
    if (!entry) return;
    entry[field] = value;
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
  }

  function addEntry(date) {
    var day = findDay(date);
    if (!day) return;
    day.entries.push({ projectId: null, activity: '' });
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
  }

  function removeEntry(date, entryIndex) {
    var day = findDay(date);
    if (!day) return;
    if (day.entries.length <= 1) return;
    day.entries.splice(entryIndex, 1);
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
  }

  function onDayStatusChange(date, newStatus) {
    var day = findDay(date);
    if (!day) return;
    if (day.dayStatus === newStatus) return;
    day.dayStatus = newStatus;
    day.workStart = (newStatus === 'Kerja') ? '08:00' : '';
    day.workEnd = (newStatus === 'Kerja') ? '17:00' : '';
    day.entries = (newStatus === 'Kerja') ? [{ projectId: null, activity: '' }] : [];
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
  }

  function onPeriodChange(pk) {
    var parts = pk.split('-');
    currentYear = parseInt(parts[0], 10);
    currentMonth = parseInt(parts[1], 10) - 1;
    currentData = loadTimesheet(currentBadge, currentYear, currentMonth);
    renderTimesheetPage();
  }

  function findIncompleteDays(days) {
    return days.filter(function(d) {
      if (d.dayStatus !== 'Kerja') return false;
      if (!d.workStart || !d.workEnd) return true;
      return d.entries.some(function(e) {
        return e.projectId == null || !e.activity || !e.activity.trim();
      });
    });
  }

  function submitTimesheet() {
    currentData = loadTimesheet(currentBadge, currentYear, currentMonth);
    if (currentData.status === 'Submitted' || currentData.status === 'Approved') {
      QuadraToast.show('This timesheet has already been processed.', 'error');
      renderTimesheetPage();
      return;
    }
    var incomplete = findIncompleteDays(currentData.days);
    if (incomplete.length > 0) {
      QuadraToast.show(
        incomplete.length + ' work day(s) are incomplete — fill in Start/End Time, Project, and Activity before submitting.',
        'error'
      );
      renderTimesheetPage();
      return;
    }
    currentData.status = 'Submitted';
    currentData.submittedAt = new Date().toISOString();
    currentData.rejectionReason = null;
    currentData.rejectedAt = null;
    currentData.rejectedBy = null;
    saveTimesheet(currentBadge, currentYear, currentMonth, currentData);
    renderTimesheetPage();
    QuadraToast.show('Timesheet submitted.', 'success');
  }

  (function init() {
    seedAllTimesheetsIfNeeded();
    currentBadge = localStorage.getItem('quadra_active_badge');
    var emp = getEmp(currentBadge);
    if (!emp) {
      document.querySelector('.main-content').innerHTML =
        '<div class="empty-state">'
        + '<div class="empty-title">No employee record found</div>'
        + '<div class="empty-desc">Your account isn\'t linked to an employee record. Please contact HR.</div>'
        + '</div>';
      return;
    }

    var now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    currentData = loadTimesheet(currentBadge, currentYear, currentMonth);
    renderTimesheetPage();
  })();
</script>

<script src="sidebar.js"></script>
