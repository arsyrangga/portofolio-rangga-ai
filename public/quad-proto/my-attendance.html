  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  (function () {
    var d = new Date();
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('todayCardDate').textContent = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  })();

  function setClockInCard(time) {
    document.getElementById('todayStatus').textContent = 'Present';
    document.getElementById('todayStatus').classList.remove('muted');
    document.getElementById('todayClockIn').textContent = fmtTime(time);
    document.getElementById('todayClockIn').classList.remove('muted');
    document.getElementById('todayClockInSub').textContent = 'Clocked in';
  }

  function setClockOutCard(time, durationMs) {
    var h = Math.floor(durationMs / 3600000);
    var m = Math.floor((durationMs % 3600000) / 60000);
    document.getElementById('todayClockOut').textContent = fmtTime(time);
    document.getElementById('todayClockOut').classList.remove('muted');
    document.getElementById('todayClockOutSub').textContent = 'Clocked out';
    document.getElementById('todayWorkHours').textContent = h + 'h ' + m + 'm';
    document.getElementById('todayWorkHours').classList.remove('muted');
  }

  (function () {
    if (sessionStorage.getItem('QUADRA_CLOCKED_IN') === 'true') {
      var ts = sessionStorage.getItem('QUADRA_CLOCK_IN_TIME');
      if (ts) setClockInCard(new Date(ts));
    }
  })();

  window.addEventListener('quadra-clockin',  function (e) { setClockInCard(e.detail.time); });
  window.addEventListener('quadra-clockout', function (e) { setClockOutCard(e.detail.time, e.detail.duration); });

  function calcWorkHrs(ci, co) {
    if (!ci || !co) return '—';
    var i = ci.split(':').map(Number), o = co.split(':').map(Number);
    var mins = (o[0] * 60 + o[1]) - (i[0] * 60 + i[1]);
    return Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm';
  }

  (function renderHistory() {
    var badge = localStorage.getItem('quadra_active_badge');
    var rows = MY_ATTENDANCE_HISTORY[badge];
    var tbody = document.getElementById('historyTbody');
    if (!rows) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">'

        + '<div class="empty-desc">Your account isn\'t linked to an employee record. Please contact HR.</div>'
        + '</div></td></tr>';

    tbody.innerHTML = rows.map(function (r) {

      var outEl = r.clockOut ? r.clockOut : '<span style="color:#9CA3AF">—</span>';
      return '<tr>'
        + '<td>' + r.date + '</td>'
        + '<td>' + inEl + '</td>'
        + '<td>' + outEl + '</td>'
        + '<td>' + calcWorkHrs(r.clockIn, r.clockOut) + '</td>'
        + '<td><span class="' + cfg.cls + '">' + cfg.label + '</span></td>'
        + '</tr>';
    }).join('');
